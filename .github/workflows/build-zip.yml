name: Build and commit bgmi.zip

on:
  push:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create archive of repository files
        run: |
          rm -f bgmi.zip
          zip -r bgmi.zip . \
            -x './.git/*' './.github/*' './bgmi.zip'

      - name: Commit and push updated archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bgmi.zip
          if git diff --cached --quiet; then
            echo 'bgmi.zip is already up to date.'
            exit 0
          fi
          git commit -m 'Update bgmi.zip'
          git push origin "HEAD:${GITHUB_REF_NAME}"
